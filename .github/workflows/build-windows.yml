name: Build Windows Receiver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Build Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Native Windows Receiver (MSVC)
        shell: cmd
        run: |
          cl.exe /O2 /EHsc /DWIN32_LEAN_AND_MEAN windows_receiver\src\receiver.cpp /Fe:windows_receiver\nintendo_receiver_msvc.exe ws2_32.lib user32.lib

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Dependencies
        run: |
          cd android_app
          flutter pub get

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output
          Copy-Item windows_receiver\nintendo_receiver_msvc.exe build_output\nintendo_receiver.exe
          Copy-Item instructions build_output\instructions.txt
          Compress-Archive -Path build_output\* -DestinationPath nintendo-switch-pro-receiver-windows.zip

      - name: Upload Windows Receiver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nintendo-Switch-Pro-Windows-Receiver
          path: nintendo-switch-pro-receiver-windows.zip
          retention-days: 30
