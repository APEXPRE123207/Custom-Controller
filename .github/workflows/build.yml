name: Build SwiCon Mobile App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd android_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd android_app
          flutter build apk --release

      - name: Stage Artifact
        run: |
          mkdir -p dist
          cp android_app/build/app/outputs/flutter-apk/app-release.apk dist/SwiCon.apk

      - name: Upload SwiCon APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiCon-Mobile-App
          path: dist/SwiCon.apk
          retention-days: 30
